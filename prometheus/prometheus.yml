global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "datathon-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
