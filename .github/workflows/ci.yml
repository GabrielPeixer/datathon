name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  code-tests:
    name: Código e testes não funcionais
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testes unitários, integração e NFR
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_prep.py tests/test_bandits.py tests/test_train.py tests/test_api.py tests/test_feature_store.py tests/test_drift.py tests/test_hyperparams.py tests/test_nfr.py

  data-and-training:
    name: Dados, drift e treino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Esteira com fixture versionada
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_pipeline.py
      - name: Publicar feature view, drift e busca de hiperparâmetros
        env:
          DATATHON_RAW_CSV: tests/fixtures/bank_sample.csv
        run: python -m src.pipeline --raw-path tests/fixtures/bank_sample.csv --n-splits 3
      - name: Publicar relatórios
        uses: actions/upload-artifact@v6
        with:
          name: mlops-reports
          path: |
            reports/drift_report.json
            reports/best_hyperparams.json
            reports/hyperparam_search.csv
            reports/experiment_summary.csv
            data/feature_store/campaign_context/metadata.json
